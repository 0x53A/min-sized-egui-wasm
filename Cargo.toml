cargo-features = ["panic-immediate-abort"]

[package]
name = "min-sized-egui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "min-sized-egui-bin"
path = "src/main.rs"

[dependencies]
log = "0.4.33"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser integrations remain available; omit the optional PNG clipboard image path.
eframe = { version = "0.37", default-features = false, features = ["glow"] }
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Performance",
    "Window"
  ] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "rust_fonts"] }




[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "immediate-abort"

[profile.dev]
#opt-level = "s"

# Browser-only fonts and optional clipboard images from our egui fork.
[patch.crates-io]
eframe = { git = "https://github.com/0x53A/egui", rev = "fd415517ecd9f6379ffc8ff2081ed69de53f1201" }
