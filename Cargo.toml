cargo-features = ["panic-immediate-abort"]

[package]
name = "min-sized-egui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "min-sized-egui-bin"
path = "src/main.rs"

[dependencies]
log = "0.4.33"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.35", default-features = false, features = [ "glow" ] } # you can see the default features here: https://github.com/emilk/egui/blob/master/crates/eframe/Cargo.toml#L34
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Performance",
    "Window"
  ] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.35", default-features = false, features = [ "glow", "wayland", "x11" ] }




[features]


[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "immediate-abort"

[profile.dev]
#opt-level = "s"
